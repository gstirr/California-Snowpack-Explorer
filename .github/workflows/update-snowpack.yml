name: Update California Snowpack

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  update-snowpack:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download and analyze snowpack
        env:
          TZ: America/Los_Angeles
        run: python snow_sensor_monitor.py

      - name: Run automated tests
        run: python tests/test_outputs.py

      - name: Test ArcGIS Online connection
        if: github.event_name == 'workflow_dispatch'
        env:
          AGOL_USERNAME: ${{ secrets.AGOL_USERNAME }}
          AGOL_PASSWORD: ${{ secrets.AGOL_PASSWORD }}
        run: |
          pip install arcgis
          python update_arcgis.py

      - name: Update public interactive map
        run: |
          cp outputs/california_snow_sensor_map.html california_snow_sensor_map.html

      - name: Publish updated map
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add california_snow_sensor_map.html
          if ! git diff --cached --quiet; then
            git commit -m "Update snowpack observations"
            git push
          fi
